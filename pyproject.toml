[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "growth-decision-agent"
version = "0.2.0"
description = "Evidence-grounded growth analytics with durable jobs and optional LLM reasoning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
growth-agent = "growth_agent.main:main"

[tool.setuptools.packages.find]
include = ["growth_agent*"]

[tool.setuptools.package-data]
growth_agent = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=growth_agent --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
